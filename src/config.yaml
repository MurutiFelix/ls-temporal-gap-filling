# src/config.yaml
project:
  name: "Landsat Temporal Gap Filling"
  seed: 42

paths:
  data_dir: "data"
  landsat_dir: "data/landsat"
  avhrr_dir: "data/avhrr"
  modis_dir: "data/modis"
  static_dir: "data/static"
  processed_dir: "data/processed"
  eda_dir: "data/processed/eda"
  logs: "src/logs"

landsat:
  bands: ["Red", "Green", "Blue", "NIR", "SWIR1", "SWIR2", "Thermal"]
  num_bands: 7
  training_years: [2000, 2025]
  gap_years: [1995, 1999]

model:
  rbfn:
    num_centers: 50
    gamma: null
    regularization_lambda: 0.001
    validation_holdout_ratio: 0.22